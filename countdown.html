<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      color: #333;
    }
    .countdown-container {
      text-align: center;
      background: #ffffff;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }
    .timer {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
    }
    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .number {
      font-size: 2.5rem;
      font-weight: bold;
      color: #2c3e50;
      min-width: 70px;
    }
    .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7f8c8d;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <div class="countdown-container">
    <h1>Countdown to August 29, 2026 at 2:00 PM</h1>
    <div class="timer">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>
  </div>

  <script>
    // Target Date: August 29, 2026 at 14:00:00 (2:00 PM)
    const targetDate = new Date("August 29, 2026 14:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.querySelector(".countdown-container").innerHTML = "<h1>The event has started!</h1>";
        clearInterval(timerInterval);
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();
    const timerInterval = setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
